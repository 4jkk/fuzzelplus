# Solarized Light theme for Fuzzel
# These are the original default values

# Font and prompt settings (inherited from main config)
# prompt="> "

# Lines and width settings (inherited from main config)
# lines=15
# width=30

[colors]
# Solarized Light color scheme
background=fdf6e3ff      # Base3 (Light background)
text=657b83ff            # Base00 (Body text)
prompt=586e75ff          # Base01 (Emphasized text)
placeholder=93a1a1ff     # Base1 (Comments/secondary)
input=657b83ff           # Base00 (Body text)
match=cb4b16ff           # Orange (Highlight)
selection=eee8d5ff       # Base2 (Selection background)
selection-text=586e75ff  # Base01 (Selection text)
selection-match=cb4b16ff # Orange (Selection highlight)
counter=93a1a1ff         # Base1 (Secondary text)
border=002b36ff          # Base03 (Dark border)

[border]
width=1
radius=10
