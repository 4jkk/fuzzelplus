# Nord theme for Fuzzel
# From Nord colorscheme: https://www.nordtheme.com/docs/colors-and-palettes

# Font and UI settings
lines=10
prompt="▶    "
width=30
font=FiraSans:size=18,Sans:size=14
line-height=27

[colors]
# Nord color palette

# Background - Nord0 (Darkest polar night)
background=2e3440ff

# Text - Nord4 (Snow storm)
text=d8dee9ff

# Prompt - Nord3 (Lighter polar night - lower contrast)
prompt=4c566aff

# Placeholder - Nord3 (Lighter polar night)
placeholder=4c566aff

# Input text - Nord7 (Frost - better contrast)
input=8fbcbbff

# Match highlighting - Nord13 (Aurora yellow)
match=ebcb8bff

# Selection background - Nord1 (Polar night)
selection=3b4252ff

# Selection text - Nord6 (Lightest snow storm)
selection-text=eceff4ff

# Match in selection - Nord15 (Aurora purple)
selection-match=b48eadff

# Counter - Nord3 (Lighter polar night)
counter=4c566aff

# Border - Nord3 (Lightest polar night)
border=4c566aff

[border]
# Border width
width=1

# Border radius for rounded corners
radius=24
